name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r build/requirements.txt
      - name: Independent verification of the committed outputs (archived inputs, strict)
        run: python tools/verify_public.py
      - name: Clean rebuild reproduces the committed data and tables
        run: |
          python tools/build_atlas.py
          git diff --stat --exit-code -- data/atlas.js data/views data/sources.json downloads build/provenance/alignment_to_1JB0.csv build/provenance/site_water.csv
      - name: Deliberate-corruption tests
        run: python -m unittest discover -s tests -v
